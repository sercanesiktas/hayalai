name: Karakter testi

on:
  push:
    paths:
      - "karakter-testi/**"
  pull_request:
    paths:
      - "karakter-testi/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-tur fonts-dejavu-core
      - run: pip install pillow
      - run: python3 -m unittest discover -s karakter-testi/test -v
