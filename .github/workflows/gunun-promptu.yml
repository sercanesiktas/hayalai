name: Günün promptu

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gunun-promptu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promptu seç
        run: php uretim/gunun-promptu.php

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add README.md gunun-promptu
          if git diff --cached --quiet; then
            echo "değişiklik yok"
            exit 0
          fi
          git commit -m "Günün promptu: $(date -u +%F)"
          git push
