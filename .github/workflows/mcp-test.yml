name: MCP testleri

on:
  push:
    paths:
      - "mcp/**"
      - "prompts.csv"
  pull_request:
    paths:
      - "mcp/**"
      - "prompts.csv"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test
